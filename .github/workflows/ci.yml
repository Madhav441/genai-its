name: CyberNexa CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validation dependencies
        run: python -m pip install --upgrade pip python-dotenv

      - name: Validate safe configuration templates
        run: python 1.5_security/config_validator.py --check-example

      - name: Compile all Python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          failures = []
          for path in pathlib.Path('.').rglob('*.py'):
              if '.venv' in path.parts:
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All Python files compiled successfully.")
          PY

      - name: Check that real secret files are not committed
        run: |
          test ! -f .env
          test ! -f .streamlit/secrets.toml
