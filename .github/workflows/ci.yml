name: CyberNexa CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Configuration, syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate example configuration
        run: python 1.5_security/config_validator.py --check-example

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            1.1_interface \
            1.2_back_end \
            1.3_models \
            1.4_agent2_quiz \
            1.5_security

      - name: Run all automated tests
        run: python -m pytest tests -v

      - name: Check for tracked private configuration
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)secrets\.toml$|service.?account.*\.json$'; then
            echo "Private configuration or credential files are tracked by Git."
            exit 1
          fi

          echo "No tracked private configuration files were found."
