name: CyberNexa CI Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv PyYAML

      - name: Validate safe configuration templates
        run: python 1.5_security/config_validator.py --check-example

      - name: Test provider routing configuration
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile all Python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          failures = []

          for path in pathlib.Path(".").rglob("*.py"):
              if ".venv" in path.parts:
                  continue

              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("All Python files compiled successfully.")
          PY

      - name: Check that real secret files are not committed
        shell: bash
        run: |
          test ! -f .env
          test ! -f .streamlit/secrets.toml

          if find . -type f -iname "*firebase-adminsdk*.json" | grep -q .; then
            echo "Firebase service-account credentials must not be committed."
            exit 1
          fi

          echo "No prohibited secret files were found."