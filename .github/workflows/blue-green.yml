name: Blue-Green Deployment Validation

on:
  push:
    branches:
      - "**"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "requirements.txt"
      - ".github/workflows/blue-green.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blue-green:
    name: Build, switch and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Blue-Green Compose file
        run: docker compose -f deploy/compose.blue-green.yml config

      - name: Build and verify Blue-Green deployment
        run: bash deploy/verify-blue-green.sh
