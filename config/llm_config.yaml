version: 1

routing:
  default_provider: groq
  allow_environment_override: true

providers:
  ollama:
    enabled: true
    model: llama3.2
    base_url: http://localhost:11434
    api_key_env: null
    input_cost_per_million_usd: 0.00
    output_cost_per_million_usd: 0.00

  groq:
    enabled: true
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    input_cost_per_million_usd: 0.15
    output_cost_per_million_usd: 0.60

  openai:
    enabled: true
    model: gpt-5-mini
    api_key_env: OPENAI_API_KEY
    input_cost_per_million_usd: 0.25
    output_cost_per_million_usd: 2.00

generation:
  temperature: 0.1
  max_tokens: 1024

governance:
  rate_limit_enabled: true
  requests_per_window: 10
  window_seconds: 60
  daily_request_limit: 250
  daily_budget_usd: 1.00